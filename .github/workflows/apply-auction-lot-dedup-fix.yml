name: Apply auction lot dedup fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-auction-lot-dedup-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch psinkamain.py and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("psinkamain.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "                if lot_no in seen_new_lots:\n",
                  "                if False and lot_no in seen_new_lots:\n",
              ),
              (
                  "                if lot_no in seen_ancient_lots:\n",
                  "                if False and lot_no in seen_ancient_lots:\n",
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue

              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly 1 occurrence of {old.strip()!r}, found {count}")

              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          workflow_path = Path(".github/workflows/apply-auction-lot-dedup-fix.yml")
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add psinkamain.py .github/workflows/apply-auction-lot-dedup-fix.yml
          git commit -m "Disable auction lot deduplication"
          git push
