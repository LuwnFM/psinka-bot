name: Bulk safe quality pass
# Re-run the full safe formatting pass after the typed domain migration.

on:
  push:
    branches:
      - refactor/modularization-ci-2026-11-19
    paths:
      - '.github/workflows/bulk-quality-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bulk-quality-refactor
  cancel-in-progress: false

jobs:
  bulk-safe-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tools and project dependencies
        run: python -m pip install -r requirements.txt 'ruff==0.17.6' mypy pytest pytest-asyncio
      - name: Record full baseline diagnostics
        shell: bash
        run: |
          mkdir -p quality-logs
          ruff check . --output-format json > quality-logs/ruff-before.json || true
          ruff format --check . > quality-logs/format-before.txt 2>&1 || true
          mypy psinkamain.py core cogs services repositories db handlers --show-error-codes --no-color-output > quality-logs/mypy-before.txt 2>&1 || true
      - name: Apply all safe lint fixes and format the whole project
        run: |
          ruff check --fix . || true
          ruff format .
          git diff --check
      - name: Record full after diagnostics
        shell: bash
        run: |
          ruff check . --output-format json > quality-logs/ruff-after.json || true
          ruff format --check . > quality-logs/format-after.txt 2>&1 || true
          mypy psinkamain.py core cogs services repositories db handlers --show-error-codes --no-color-output > quality-logs/mypy-after.txt 2>&1 || true
      - name: Run full regression suite before any commit
        run: python -m pytest -q
      - name: Verify slash command registrations and compilation
        run: |
          python -m compileall -q psinkamain.py core cogs services repositories db handlers
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('psinkamain.py').read_text(encoding='utf-8'))
          names = [node.name for node in tree.body if isinstance(node, ast.AsyncFunctionDef)
                   and any('slash_command' in ast.unparse(d) for d in node.decorator_list)]
          assert len(names) == 19, f'Expected 19 slash commands; got {len(names)}'
          assert len(names) == len(set(names)), 'Duplicate slash commands'
          PY
      - name: Upload before and after full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-ruff-mypy-format-diagnostics
          path: quality-logs/
          if-no-files-found: warn
      - name: Commit tested changes together, only on refactor branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != 'refactor/modularization-ci-2026-11-19' ]]; then
            echo 'Refusing commit on unexpected branch'
            exit 1
          fi
          git add -- '*.py'
          if git diff --cached --quiet; then
            echo 'No changes from bulk pass'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply whole-project safe Ruff fixes and formatting'
          git push origin HEAD:refactor/modularization-ci-2026-11-19
