name: Apply role-name admin command fix

on:
  push:
    branches:
      - fix-role-name-admin
    paths:
      - '.github/workflows/patch-role-name-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix-role-name-admin
          fetch-depth: 0

      - name: Patch only role grant/remove handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('cogs/text_admin.py')
          text = path.read_text(encoding='utf-8')

          def replace_count(old: str, new: str, expected: int, label: str) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, got {count}')
              text = text.replace(old, new)

          replace_count(
              'ROLE_MENTION_RE = re.compile(r"<@&(\\d{15,25})>")\n',
              '', 1, 'remove ROLE_MENTION_RE',
          )
          replace_count(
              '    r"(?P<role><@&\\d{15,25}>)"\n',
              '    r"(?P<role>.+?)"\n',
              2, 'role regexes',
          )

          marker = '''def _member_by_mention(guild: disnake.Guild, mention: Optional[str]) -> Optional[disnake.Member]:
              if not mention:
                  return None
              match = USER_MENTION_RE.fullmatch(mention.strip())
              if not match:
                  return None
              return guild.get_member(int(match.group(1)))
          '''
          helper = marker + '''

          def _role_by_name(
              guild: disnake.Guild,
              role_name: Optional[str],
          ) -> Tuple[Optional[disnake.Role], Optional[str]]:
              """Ищет роль по точному названию без Discord-упоминания."""
              raw_name = (role_name or "").strip()
              if not raw_name:
                  return None, "название роли пустое"

              wanted = raw_name.casefold()
              matches = [role for role in guild.roles if role.name.strip().casefold() == wanted]
              if not matches:
                  return None, f"роль «{raw_name}» не найдена"
              if len(matches) > 1:
                  return None, f"на сервере несколько ролей с названием «{raw_name}»"
              return matches[0], None
          '''
          replace_count(marker, helper, 1, 'insert _role_by_name')

          replace_count(
              '            "`На тебя возлагается знак @Роль за назначение`\\n"\n'
              '            "`С тебя снимается знак @Роль за снятие полномочий`\\n"\n'
              '            "Доступ: **только Администратор**.\\n\\n"\n',
              '            "`На тебя возлагается знак Посетитель Аукциона за назначение`\\n"\n'
              '            "`С тебя снимается знак Посетитель Аукциона за снятие полномочий`\\n"\n'
              '            "Роль указывается **обычным названием без @упоминания**. Ответ бота роль не пингует.\\n"\n'
              '            "Доступ: **только Администратор**.\\n\\n"\n',
              1, 'help role examples',
          )

          replace_count(
              '''        role_match = ROLE_MENTION_RE.fullmatch(match.group("role"))
                  role = message.guild.get_role(int(role_match.group(1))) if role_match else None
                  if role is None:
                      await message.reply("❌ Не удалось распознать служебный знак — укажи настоящее упоминание роли.", mention_author=False)
                      return
          ''',
              '''        role_name = match.group("role").strip()
                  role, role_error = _role_by_name(message.guild, role_name)
                  if role is None:
                      await message.reply(
                          f"❌ Не удалось распознать служебный знак: {role_error}. "
                          "Укажи точное название роли без @упоминания.",
                          mention_author=False,
                          allowed_mentions=disnake.AllowedMentions.none(),
                      )
                      return
                  role_label = disnake.utils.escape_markdown(role.name)
          ''',
              1, '_handle_role lookup',
          )

          replacements = [
              ('f"ℹ️ На {target.mention} уже возложен знак {role.mention}."',
               'f"ℹ️ На {target.mention} уже возложен знак **{role_label}**."'),
              ('f"🎖️ На {target.mention} возложен знак {role.mention}.\\n**Причина:** {reason}"',
               'f"🎖️ На {target.mention} возложен знак **{role_label}**.\\n**Причина:** {reason}"'),
              ('f"ℹ️ На {target.mention} нет знака {role.mention}."',
               'f"ℹ️ На {target.mention} нет знака **{role_label}**."'),
              ('f"🎖️ С {target.mention} снят знак {role.mention}.\\n**Причина:** {reason}"',
               'f"🎖️ С {target.mention} снят знак **{role_label}**.\\n**Причина:** {reason}"'),
          ]
          for old, new in replacements:
              replace_count(old, new, 1, old)

          if 'ROLE_MENTION_RE' in text:
              raise SystemExit('ROLE_MENTION_RE still present')
          if 'role.mention' in text:
              raise SystemExit('role.mention still present')
          if 'Посетитель Аукциона' not in text:
              raise SystemExit('help example not updated')

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile cogs/text_admin.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "cogs/text_admin.py"

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-role-name-admin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogs/text_admin.py .github/workflows/patch-role-name-admin.yml
          git diff --cached --check
          git commit -m 'Allow admin role commands by role name'
          git push origin HEAD:fix-role-name-admin
