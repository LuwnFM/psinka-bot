name: Reconstruct v0.4.3 release branch

on:
  push:
    branches:
      - release-v0.4.3
    paths:
      - '.release_payload/ready'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-v0.4.3
          fetch-depth: 0

      - name: Reconstruct verified release tree
        shell: bash
        run: |
          set -euo pipefail
          cat .release_payload/chunk_* | tr -d '\n\r' | base64 --decode > /tmp/release_texts.tar.xz
          echo 'd488abeca4ee057bf37aa349106b9fe9ebd76c64ae1fda121910c463abd28ac5  /tmp/release_texts.tar.xz' | sha256sum --check -
          mkdir -p /tmp/release-tree
          tar -xJf /tmp/release_texts.tar.xz -C /tmp/release-tree
          cp -a /tmp/release-tree/. .
          rm -rf .release_payload
          rm -rf __pycache__ cogs/__pycache__ core/__pycache__ 'old versions/__pycache__'
          rm -f .github/workflows/reconstruct-v043.yml
          python -m compileall -q .
          rm -rf __pycache__ cogs/__pycache__ core/__pycache__ 'old versions/__pycache__'

      - name: Commit release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.4.3: RP Guard, Dice Rewrite & AI Routing'
          git push origin HEAD:release-v0.4.3
