name: Apply license and README docs fix

on:
  push:
    branches:
      - docs-license-ru-2026-08-27
    paths:
      - '.github/workflows/apply-license-docs-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs-license-ru-2026-08-27
          fetch-depth: 0

      - name: Apply documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          license_path = root / 'LICENSE'
          original_license = license_path.read_text(encoding='utf-8')
          notice = '''PsIInka Bot — Discord bot for role-play communities
          Copyright (C) 2026 LuwnFM

          Project: PsIInka Bot
          Author and copyright holder: LuwnFM
          Repository: https://github.com/LuwnFM/psinka-bot
          License: GNU General Public License, version 3 (GPLv3)

          This program is free software: you can redistribute it and/or modify
          it under the terms of the GNU General Public License as published by
          the Free Software Foundation, version 3 of the License.

          This program is distributed in the hope that it will be useful,
          but WITHOUT ANY WARRANTY; without even the implied warranty of
          MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the
          GNU General Public License below for more details.

          You should have received a copy of the GNU General Public License
          along with this program. If not, see <https://www.gnu.org/licenses/>.

          NOTE: The placeholders such as <year> and <name of author> near the end
          of the document below are part of the Free Software Foundation's official
          GPLv3 text (the "How to Apply These Terms" example). They are intentionally
          left unchanged. The project-specific notice above is the completed notice
          for PsIInka Bot.

          ===============================================================================
          OFFICIAL GNU GPLv3 TEXT — UNMODIFIED
          ===============================================================================

          '''
          # Remove indentation introduced by the YAML block while preserving license formatting.
          import textwrap
          notice = textwrap.dedent(notice)
          if not original_license.startswith('PsIInka Bot —'):
              license_path.write_text(notice + original_license, encoding='utf-8')
          new_license = license_path.read_text(encoding='utf-8')
          marker = '                    GNU GENERAL PUBLIC LICENSE\n'
          idx = new_license.find(marker)
          if idx < 0 or new_license[idx:] != original_license:
              raise SystemExit('Official GPLv3 text changed unexpectedly')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          old_quality = '''`Недвижкаролл` и `Качестворолл` используют одну 9-уровневую шкалу:

          | Качество | Шанс |
          |---|---:|
          | Ужасное | 2% |
          | Плохое | 5% |
          | Ниже среднего | 10% |
          | Приемлемое | 14% |
          | Нормальное | 34% |
          | Хорошее | 20% |
          | Очень хорошее | 10% |
          | Отличное | 4% |
          | Шедевр | 1% |
          '''
          new_quality = '''`Недвижкаролл` и `Качестворолл` используют одну 9-уровневую шкалу качеств:

          - Ужасное
          - Плохое
          - Ниже среднего
          - Приемлемое
          - Нормальное
          - Хорошее
          - Очень хорошее
          - Отличное
          - Шедевр

          Вероятности выпадения качеств намеренно не публикуются в README.
          '''
          old_quality = textwrap.dedent(old_quality)
          new_quality = textwrap.dedent(new_quality)
          if old_quality not in readme:
              raise SystemExit('README quality probability table was not found')
          readme = readme.replace(old_quality, new_quality, 1)
          readme = readme.replace(
              '- проверка совпадения весов `Недвижкаролл` и `Качестворолл` — сумма 100%;',
              '- проверка единой 9-уровневой шкалы `Недвижкаролл` и `Качестворолл`;',
              1,
          )
          old_license_section = '''# 📜 Лицензия

          Проект распространяется по **GNU General Public License v3.0 (GPLv3)**. Полный текст — в [`LICENSE`](LICENSE).

          **Разработчик:** LuwnFM'''
          new_license_section = '''# 📜 Лицензия

          **PsIInka Bot** распространяется на условиях **GNU General Public License v3.0 (GPLv3)**.

          - [`LICENSE`](LICENSE) — юридически определяющий английский оригинал GPLv3 с заполненным уведомлением проекта: **Copyright (C) 2026 LuwnFM**.
          - [`LICENSE.ru.md`](LICENSE.ru.md) — русскоязычное уведомление и справочная информация о лицензии. Юридически определяющим остаётся английский текст GPLv3.

          **Автор и правообладатель проекта:** LuwnFM'''
          old_license_section = textwrap.dedent(old_license_section)
          new_license_section = textwrap.dedent(new_license_section)
          if old_license_section not in readme:
              raise SystemExit('README license section was not found')
          readme = readme.replace(old_license_section, new_license_section, 1)
          readme_path.write_text(readme, encoding='utf-8')

          ru = '''# PsIInka Bot — лицензия / License (RU)

          **PsIInka Bot** — Discord-бот для ролевых сообществ.  
          **Copyright (C) 2026 LuwnFM**  
          **Автор и правообладатель:** LuwnFM  
          **Репозиторий:** https://github.com/LuwnFM/psinka-bot  
          **Лицензия:** GNU General Public License, версия 3 (GPLv3).

          ## Уведомление о лицензировании

          Эта программа является свободным программным обеспечением: вы можете распространять её и/или изменять на условиях GNU General Public License версии 3, опубликованной Free Software Foundation.

          Программа распространяется в надежде, что она будет полезна, но **БЕЗ КАКИХ-ЛИБО ГАРАНТИЙ**, включая подразумеваемые гарантии товарной пригодности или пригодности для конкретной цели. Подробные юридические условия содержатся в полном английском тексте GNU GPLv3 в файле [`LICENSE`](LICENSE).

          Получатель должен иметь возможность ознакомиться с GNU General Public License вместе с программой. Официальный текст также доступен на сайте GNU: https://www.gnu.org/licenses/gpl-3.0.html

          ## Статус русской версии

          Этот файл предназначен для русскоязычных пользователей и **не заменяет юридически определяющий английский оригинал GNU GPLv3**. При любом расхождении между русским описанием и английским текстом применяется английский текст из [`LICENSE`](LICENSE).

          Free Software Foundation публикует список неофициальных переводов GNU GPL. Для русского языка доступен полный неофициальный перевод GPLv3 Павла Протасова:

          - Русский перевод GPLv3: https://www.duralex.org/licenses/gplru.pdf
          - Список переводов GNU: https://www.gnu.org/licenses/translations.html

          > Важно: `agplru.pdf` — это перевод **GNU Affero GPLv3 (AGPLv3)**, то есть другой лицензии с дополнительными условиями для сетевого использования. PsIInka Bot в этом репозитории лицензируется именно по **GNU GPLv3**, а не AGPLv3.

          ## Основные положения GPLv3 — справочно

          Ниже приведено краткое русскоязычное описание основных прав и обязанностей. Оно помогает понять условия, но не заменяет полный английский текст лицензии.

          1. **Свобода использования.** Программу можно запускать для любых целей без ограничения со стороны GPL.
          2. **Копирование и распространение.** Разрешено передавать точные копии исходного кода бесплатно или за плату при сохранении уведомлений об авторских правах, лицензии и отсутствии гарантий.
          3. **Изменение исходного кода.** Разрешено изменять программу и распространять изменённые версии, если изменения явно обозначены и вся производная работа, подпадающая под GPL, распространяется на совместимых условиях GPL.
          4. **Исходный код при распространении бинарных версий.** При передаче объектного кода необходимо предоставить соответствующий исходный код или предусмотренный GPL способ его получения.
          5. **Сохранение свобод.** Нельзя налагать дополнительные ограничения, которые лишают получателей прав, предоставленных GPL.
          6. **Патенты.** Участники, передающие вклад в GPL-проект, предоставляют предусмотренные GPL патентные разрешения; патентные соглашения не должны превращать свободную программу в несвободную.
          7. **Технические ограничения устройств.** Для охватываемых GPL пользовательских продуктов могут действовать требования о предоставлении информации, необходимой для установки изменённых версий.
          8. **Прекращение прав при нарушении.** Права по GPL могут прекратиться при нарушении условий и могут восстанавливаться в случаях и сроки, предусмотренные самой GPLv3.
          9. **Автоматическое получение прав последующими получателями.** Каждый получатель получает права непосредственно на условиях GPL; навязывать дополнительные ограничения нельзя.
          10. **Совместимость с GNU AGPLv3.** GPLv3 допускает определённые комбинации с кодом под GNU AGPLv3, при этом для такой комбинации применяются специальные сетевые требования AGPL к соответствующим частям. Это не превращает сам PsIInka Bot автоматически в AGPL-проект.
          11. **Отсутствие гарантий.** Программа предоставляется «как есть» в максимально допустимой законом степени.
          12. **Ограничение ответственности.** Правообладатели и участники не несут предусмотренную GPL ответственность за убытки, кроме случаев, когда иное обязательно установлено применимым законом или письменным соглашением.

          ## Применение к PsIInka Bot

          Для этого проекта заполненное уведомление выглядит так:

          ```text
          PsIInka Bot — Discord bot for role-play communities
          Copyright (C) 2026 LuwnFM

          This program is free software: you can redistribute it and/or modify
          it under the terms of the GNU General Public License as published by
          the Free Software Foundation, version 3 of the License.

          This program is distributed in the hope that it will be useful,
          but WITHOUT ANY WARRANTY; without even the implied warranty of
          MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the
          GNU General Public License for more details.
          ```

          Поля `<year>`, `<name of author>` и аналогичные строки, которые видны в конце официального английского GPLv3, являются частью раздела **“How to Apply These Terms to Your New Programs”** — это шаблон-пример Free Software Foundation внутри неизменяемого текста самой лицензии. Они не являются незаполненными полями проекта. Заполненные данные PsIInka Bot находятся в начале [`LICENSE`](LICENSE) и в этом файле.
          '''
          (root / 'LICENSE.ru.md').write_text(textwrap.dedent(ru), encoding='utf-8')

          # Documentation-only validation.
          readme_check = readme_path.read_text(encoding='utf-8')
          quality_start = readme_check.index('`Недвижкаролл` и `Качестворолл` используют одну 9-уровневую шкалу качеств:')
          quality_end = readme_check.index('### 💰 `/цены`', quality_start)
          quality_block = readme_check[quality_start:quality_end]
          if '%' in quality_block or '| Шанс |' in quality_block:
              raise SystemExit('Quality probabilities are still exposed in README')
          for quality in ['Ужасное','Плохое','Ниже среднего','Приемлемое','Нормальное','Хорошее','Очень хорошее','Отличное','Шедевр']:
              if quality not in quality_block:
                  raise SystemExit(f'Missing quality in README: {quality}')
          if 'Copyright (C) 2026 LuwnFM' not in new_license:
              raise SystemExit('Project copyright notice missing')
          PY

          rm -f .github/workflows/apply-license-docs-fix.yml

      - name: Commit docs update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Docs: clarify GPLv3 licensing and hide roll probabilities'
          git push origin HEAD:docs-license-ru-2026-08-27
