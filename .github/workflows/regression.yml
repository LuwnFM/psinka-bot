name: Regression checks

on:
  push:
    branches:
      - refactor/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install pytest openpyxl
      - name: Compile all active Python modules
        run: python -m compileall -q psinkamain.py core cogs services
      - name: Run isolated domain regression tests
        run: python -m pytest -q tests/test_post_count_templates.py tests/test_post_count_settings.py tests/test_auction_text.py tests/test_dice.py tests/test_spreadsheets.py tests/test_source_equivalence.py
      - name: Verify all slash command definitions were retained
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('psinkamain.py').read_text(encoding='utf-8'))
          names = [node.name for node in tree.body if isinstance(node, ast.AsyncFunctionDef)
                   and any('slash_command' in ast.unparse(d) for d in node.decorator_list)]
          assert len(names) == 19, f'Expected 19 slash commands, got {len(names)}: {names}'
          assert len(names) == len(set(names)), 'Duplicate command handlers'
          PY
