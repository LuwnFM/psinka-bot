name: Apply targeted OpenRouter retry fix

on:
  push:
    branches:
      - fix-openrouter-retries
    paths:
      - '.github/workflows/patch-openrouter-retries.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix-openrouter-retries
          fetch-depth: 0

      - name: Patch only OpenRouter request function
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('psinkamain.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'async def test_openrouter_single\(.*?(?=\n\nasync def test_groq_single\()',
              re.S,
          )

          replacement = '''async def test_openrouter_single(models: list, prompt: str, timeout: float = 45.0,
                                           system_prompt: str = None, proxy_url: str = None) -> Tuple[bool, str, float]:
              """Запрос к OpenRouter с одним контролируемым retry для временных ошибок."""
              openrouter_token = os.getenv('OPENR_TOKEN')
              if not openrouter_token:
                  return False, "No OPENR_TOKEN", 0.0

              if isinstance(models, str):
                  models = [models]
              models = [
                  str(model).strip()
                  for model in models
                  if str(model).strip() and not is_model_excluded("OpenRouter", model)
              ]
              if not models:
                  return False, "Все модели OpenRouter исключены из маршрута", 0.0

              start = time.time()
              messages = []
              if system_prompt:
                  messages.append({"role": "system", "content": system_prompt})
              messages.append({"role": "user", "content": prompt})

              # OpenAI SDK сам по умолчанию повторяет 429/5xx. Отключаем скрытые
              # повторы, чтобы количество запросов контролировал только роутер бота.
              client = OpenAI(
                  base_url="https://openrouter.ai/api/v1",
                  api_key=openrouter_token,
                  timeout=timeout,
                  max_retries=0,
              )

              for model in models:
                  for attempt in range(2):
                      try:
                          def sync_call():
                              return client.chat.completions.create(
                                  model=model,
                                  messages=messages,
                                  extra_headers={
                                      "HTTP-Referer": "https://github.com/psiiinka-bot",
                                      "X-Title": "PsIInka Bot",
                                  },
                              )

                          response = await asyncio.wait_for(
                              asyncio.to_thread(sync_call),
                              timeout=timeout + 5,
                          )

                          if response.choices and len(response.choices) > 0:
                              answer = response.choices[0].message.content
                              if answer and answer.strip():
                                  elapsed = time.time() - start
                                  logger.debug(f"✅ OpenRouter/{model} — {elapsed:.2f}s")
                                  return True, answer.strip(), elapsed

                          raise Exception("Пустой ответ от OpenRouter")

                      except Exception as e:
                          err_str = str(e).lower()
                          status_code = getattr(e, "status_code", None)
                          if status_code is None:
                              response_obj = getattr(e, "response", None)
                              status_code = getattr(response_obj, "status_code", None)

                          try:
                              status_num = int(status_code) if status_code is not None else None
                          except (TypeError, ValueError):
                              status_num = None

                          detail = " ".join(str(e).split())[:160]
                          status_label = status_num if status_num is not None else "?"
                          logger.info(f"⚠️ OpenRouter/{model}: HTTP {status_label} — {detail}")

                          is_timeout = (
                              isinstance(e, asyncio.TimeoutError)
                              or "timeout" in err_str
                              or "timed out" in err_str
                          )
                          is_not_found = (
                              status_num == 404
                              or "404" in err_str
                              or "invalid model" in err_str
                              or "not found" in err_str
                          )
                          is_rate_limit = (
                              status_num == 429
                              or "429" in err_str
                              or "rate limit" in err_str
                          )
                          is_server_error = (
                              status_num is not None and 500 <= status_num <= 599
                          )

                          # 404/невалидная модель — сразу следующая модель, без ожидания.
                          if is_not_found:
                              break

                          # Только один наш retry для временного rate limit или 5xx.
                          if (is_rate_limit or is_server_error) and attempt == 0:
                              delay = 2.0 if is_rate_limit else 1.0
                              reason = "429" if is_rate_limit else f"HTTP {status_label}"
                              logger.info(
                                  f"↻ OpenRouter/{model}: один повтор после {reason}, ожидание {delay:.0f}с"
                              )
                              await asyncio.sleep(delay)
                              continue

                          # Таймаут, auth/permission и прочие постоянные ошибки
                          # не ретраим здесь: внешний роутер перейдёт дальше.
                          if is_timeout:
                              logger.info(f"⏰ OpenRouter/{model}: таймаут, переход к следующей модели")
                          break

              elapsed = time.time() - start
              return False, "Все модели OpenRouter недоступны", elapsed
          '''

          new_text, count = pattern.subn(replacement.rstrip(), text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one OpenRouter function, replaced: {count}')
          if 'max_retries=0' not in new_text:
              raise SystemExit('max_retries=0 was not applied')
          if 'async def test_groq_single' not in new_text:
              raise SystemExit('Groq function boundary was damaged')

          path.write_text(new_text, encoding='utf-8')
          PY

          python -m py_compile psinkamain.py
          git diff --check

          changed="$(git diff --name-only)"
          test "$changed" = "psinkamain.py"

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-openrouter-retries.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add psinkamain.py .github/workflows/patch-openrouter-retries.yml
          git diff --cached --check
          git commit -m 'Fix OpenRouter retries and request diagnostics'
          git push origin HEAD:fix-openrouter-retries
